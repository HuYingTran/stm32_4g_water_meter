; PlatformIO Project Configuration File
; Thiết bị đo lưu lượng nước 4G — STM32F103C6T6 + A7680C + YF-S102
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C6]
platform      = ststm32
board         = genericSTM32F103C6
framework     = arduino
upload_protocol = stlink          ; nạp qua ST-Link (đổi 'serial' nếu dùng UART bootloader)
monitor_speed = 115200

build_flags =
    -D ENABLE_HWSERIAL1           ; Serial1 (USART1 PA9/PA10) -> modem A7680C
    -D ENABLE_HWSERIAL2           ; Serial2 (USART2 PA2/PA3)  -> debug log
    -Os                           ; tối ưu dung lượng (flash C6 chỉ 32KB)

; LƯU Ý: STM32F103C6T6 chỉ có 32KB Flash / 10KB RAM — khá chật.
; Nếu build báo tràn flash, đổi board sang genericSTM32F103C8 (64KB)
; hoặc bluepill_f103c8 — phần lớn "blue pill" trên thị trường thực chất là C8/CB.
